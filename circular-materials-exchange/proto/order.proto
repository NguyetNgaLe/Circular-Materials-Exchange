syntax = "proto3";
package order;
option go_package = "./pb";

service OrderService {
  rpc CreateOffer(CreateOfferRequest) returns (Offer);
  rpc GetOffer(GetOfferRequest) returns (Offer);
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  rpc AcceptOffer(AcceptOfferRequest) returns (Transaction);
  rpc RejectOffer(RejectOfferRequest) returns (Offer);
  rpc CancelOffer(CancelOfferRequest) returns (Offer);
  rpc GetTransaction(GetTransactionRequest) returns (Transaction);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpdateTransactionStatus(UpdateStatusRequest) returns (Transaction);
  rpc GetFinanceOverview(Empty) returns (FinanceOverview);
  rpc ListPlatformFees(PageRequest) returns (ListPlatformFeesResponse);
  rpc GetPlatformWallet(Empty) returns (PlatformWallet);
  rpc ListPlatformWalletTransactions(PageRequest) returns (ListPlatformWalletTransactionsResponse);
  rpc CollectFee(CollectFeeRequest) returns (CollectFeeResponse);
  rpc CreateEscrow(CreateEscrowRequest) returns (EscrowTransaction);
  rpc ListEscrows(PageRequest) returns (ListEscrowsResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (EscrowTransaction);
  rpc GetSellerWallet(SellerRequest) returns (SellerWallet);
  rpc ListSellerWalletTransactions(SellerRequest) returns (ListSellerWalletTransactionsResponse);
  rpc CreateWithdrawal(CreateWithdrawalRequest) returns (WithdrawalRequest);
  rpc ListSellerWithdrawals(SellerRequest) returns (ListWithdrawalsResponse);
  rpc ListWithdrawals(PageRequest) returns (ListWithdrawalsResponse);
  rpc ApproveWithdrawal(ProcessWithdrawalRequest) returns (WithdrawalRequest);
  rpc RejectWithdrawal(ProcessWithdrawalRequest) returns (WithdrawalRequest);
}

message Offer {
  string id = 1;
  string type = 2;
  string listing_id = 3;
  string listing_title = 4;
  string buyer_id = 5;
  string buyer_name = 6;
  string seller_id = 7;
  string seller_name = 8;
  double quantity = 9;
  string unit = 10;
  double proposed_price = 11;
  string currency = 12;
  string message = 13;
  string status = 14;
  string created_at = 15;
}

message Transaction {
  string id = 1;
  string offer_id = 2;
  string listing_title = 3;
  string buyer_id = 4;
  string buyer_name = 5;
  string seller_id = 6;
  string seller_name = 7;
  double quantity = 8;
  string unit = 9;
  double agreed_price = 10;
  string currency = 11;
  string payment_status = 12;
  string payment_method = 13;
  string settlement_note = 14;
  string status = 15;
  string created_at = 16;
  repeated TransactionEvent events = 17;
}

message TransactionEvent {
  string id = 1;
  string actor_id = 2;
  string actor_name = 3;
  string from_status = 4;
  string to_status = 5;
  string note = 6;
  string created_at = 7;
}

message CreateOfferRequest {
  string type = 1;
  string listing_id = 2;
  string listing_title = 3;
  string buyer_id = 4;
  string buyer_name = 5;
  string seller_id = 6;
  string seller_name = 7;
  double quantity = 8;
  string unit = 9;
  double proposed_price = 10;
  string currency = 11;
  string message = 12;
}

message GetOfferRequest {
  string id = 1;
}

message ListOffersRequest {
  string user_id = 1;
  string role = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListOffersResponse {
  repeated Offer offers = 1;
  int32 total = 2;
}

message AcceptOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
  string actor_name = 3;
}

message RejectOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
}

message CancelOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
}

message GetTransactionRequest {
  string id = 1;
}

message ListTransactionsRequest {
  string user_id = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

message UpdateStatusRequest {
  string transaction_id = 1;
  string new_status = 2;
  string actor_id = 3;
  string actor_name = 4;
  string note = 5;
}

message Empty {}

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message FinanceOverview {
  double total_income = 1;
  double month_income = 2;
  int64 total_transactions = 3;
  double wallet_balance = 4;
  repeated MonthlyRevenue monthly_revenue = 5;
}

message MonthlyRevenue {
  string month = 1;
  double revenue = 2;
}

message PlatformFee {
  string id = 1;
  string transaction_id = 2;
  string seller_id = 3;
  string buyer_id = 4;
  double transaction_amount = 5;
  double fee_rate = 6;
  double fee_amount = 7;
  string fee_type = 8;
  string status = 9;
  string collected_at = 10;
  string created_at = 11;
  string listing_title = 12;
}

message ListPlatformFeesResponse {
  repeated PlatformFee fees = 1;
  int32 total = 2;
}

message PlatformWallet {
  double balance = 1;
  double total_income = 2;
  double total_expense = 3;
}

message PlatformWalletTransaction {
  string id = 1;
  string type = 2;
  double amount = 3;
  double balance_after = 4;
  string reference_type = 5;
  string reference_id = 6;
  string description = 7;
  string created_at = 8;
}

message ListPlatformWalletTransactionsResponse {
  repeated PlatformWalletTransaction transactions = 1;
  int32 total = 2;
}

message CollectFeeRequest {
  string transaction_id = 1;
  string seller_id = 2;
  string buyer_id = 3;
  double transaction_amount = 4;
  double fee_rate = 5;
}

message CollectFeeResponse {
  string fee_id = 1;
  double fee_amount = 2;
  double wallet_balance = 3;
}

message CreateEscrowRequest {
  string transaction_id = 1;
  string buyer_id = 2;
  string buyer_name = 3;
  string seller_id = 4;
  string seller_name = 5;
  double amount = 6;
  int32 hold_days = 7;
}

message EscrowTransaction {
  string id = 1;
  string transaction_id = 2;
  string buyer_id = 3;
  string buyer_name = 4;
  string seller_id = 5;
  string seller_name = 6;
  double amount = 7;
  double fee_rate = 8;
  double fee_amount = 9;
  double seller_amount = 10;
  string status = 11;
  string hold_until = 12;
  string released_at = 13;
  string created_at = 14;
}

message ListEscrowsResponse {
  repeated EscrowTransaction escrows = 1;
  int32 total = 2;
}

message ReleaseEscrowRequest {
  string id = 1;
}

message SellerRequest {
  string seller_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SellerWallet {
  string seller_id = 1;
  string seller_name = 2;
  double balance = 3;
  double total_earned = 4;
  double total_fees_paid = 5;
  double total_withdrawn = 6;
}

message SellerWalletTransaction {
  string id = 1;
  string type = 2;
  double amount = 3;
  double balance_after = 4;
  string reference_type = 5;
  string reference_id = 6;
  string description = 7;
  string created_at = 8;
}

message ListSellerWalletTransactionsResponse {
  repeated SellerWalletTransaction transactions = 1;
  int32 total = 2;
}

message CreateWithdrawalRequest {
  string seller_id = 1;
  string seller_name = 2;
  double amount = 3;
  string bank_name = 4;
  string bank_account = 5;
  string bank_owner = 6;
}

message WithdrawalRequest {
  string id = 1;
  string seller_id = 2;
  string seller_name = 3;
  double amount = 4;
  string bank_name = 5;
  string bank_account = 6;
  string bank_owner = 7;
  string status = 8;
  string admin_note = 9;
  string processed_at = 10;
  string created_at = 11;
}

message ListWithdrawalsResponse {
  repeated WithdrawalRequest withdrawals = 1;
  int32 total = 2;
}

message ProcessWithdrawalRequest {
  string id = 1;
  string reason = 2;
}
