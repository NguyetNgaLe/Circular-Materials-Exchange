syntax = "proto3";
package order;
option go_package = "./pb";

service OrderService {
  rpc CreateOffer(CreateOfferRequest) returns (Offer);
  rpc GetOffer(GetOfferRequest) returns (Offer);
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  rpc AcceptOffer(AcceptOfferRequest) returns (Transaction);
  rpc RejectOffer(RejectOfferRequest) returns (Offer);
  rpc CancelOffer(CancelOfferRequest) returns (Offer);
  rpc GetTransaction(GetTransactionRequest) returns (Transaction);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpdateTransactionStatus(UpdateStatusRequest) returns (Transaction);
}

message Offer {
  string id = 1;
  string type = 2;
  string listing_id = 3;
  string listing_title = 4;
  string buyer_id = 5;
  string buyer_name = 6;
  string seller_id = 7;
  string seller_name = 8;
  double quantity = 9;
  string unit = 10;
  double proposed_price = 11;
  string currency = 12;
  string message = 13;
  string status = 14;
  string created_at = 15;
}

message Transaction {
  string id = 1;
  string offer_id = 2;
  string listing_title = 3;
  string buyer_id = 4;
  string buyer_name = 5;
  string seller_id = 6;
  string seller_name = 7;
  double quantity = 8;
  string unit = 9;
  double agreed_price = 10;
  string currency = 11;
  string payment_status = 12;
  string payment_method = 13;
  string settlement_note = 14;
  string status = 15;
  string created_at = 16;
  repeated TransactionEvent events = 17;
}

message TransactionEvent {
  string id = 1;
  string actor_id = 2;
  string actor_name = 3;
  string from_status = 4;
  string to_status = 5;
  string note = 6;
  string created_at = 7;
}

message CreateOfferRequest {
  string type = 1;
  string listing_id = 2;
  string listing_title = 3;
  string buyer_id = 4;
  string buyer_name = 5;
  string seller_id = 6;
  string seller_name = 7;
  double quantity = 8;
  string unit = 9;
  double proposed_price = 10;
  string currency = 11;
  string message = 12;
}

message GetOfferRequest {
  string id = 1;
}

message ListOffersRequest {
  string user_id = 1;
  string role = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListOffersResponse {
  repeated Offer offers = 1;
  int32 total = 2;
}

message AcceptOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
  string actor_name = 3;
}

message RejectOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
}

message CancelOfferRequest {
  string offer_id = 1;
  string actor_id = 2;
}

message GetTransactionRequest {
  string id = 1;
}

message ListTransactionsRequest {
  string user_id = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

message UpdateStatusRequest {
  string transaction_id = 1;
  string new_status = 2;
  string actor_id = 3;
  string actor_name = 4;
  string note = 5;
}
