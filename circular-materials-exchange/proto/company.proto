syntax = "proto3";
package company;
option go_package = "./pb";

service CompanyService {
  rpc CreateCompany(CreateCompanyRequest) returns (Company);
  rpc GetCompany(GetCompanyRequest) returns (Company);
  rpc GetCompanyByOwner(GetCompanyByOwnerRequest) returns (Company);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (Company);
  rpc ApproveCompany(ApproveCompanyRequest) returns (Company);
  rpc RejectCompany(RejectCompanyRequest) returns (Company);
}

message Company {
  string id = 1;
  string name = 2;
  string tax_code = 3;
  string address = 4;
  string city = 5;
  string description = 6;
  string status = 7;
  string reject_reason = 8;
  string owner_id = 9;
  double rating = 10;
  int32 review_count = 11;
  string member_since = 12;
  repeated string certifications = 13;
  string image_url = 14;
}

message CreateCompanyRequest {
  string name = 1;
  string tax_code = 2;
  string address = 3;
  string city = 4;
  string description = 5;
  string owner_id = 6;
}

message GetCompanyRequest {
  string id = 1;
}

message GetCompanyByOwnerRequest {
  string owner_id = 1;
}

message ListCompaniesRequest {
  string status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListCompaniesResponse {
  repeated Company companies = 1;
  int32 total = 2;
}

message UpdateCompanyRequest {
  string id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  string description = 5;
}

message ApproveCompanyRequest {
  string id = 1;
}

message RejectCompanyRequest {
  string id = 1;
  string reason = 2;
}
