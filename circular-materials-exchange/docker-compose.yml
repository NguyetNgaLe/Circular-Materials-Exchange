services:
  # ========== PostgreSQL (shared, multiple databases) ==========
  postgres:
    image: postgres:15
    container_name: cme-postgres
    environment:
      POSTGRES_USER: cme
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/seed-demo-data.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cme -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== NATS ==========
  nats:
    image: nats:latest
    container_name: cme-nats
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped
    networks:
      - cme-network

  # ========== MinIO (Object Storage) ==========
  minio:
    image: minio/minio:latest
    container_name: cme-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cme_minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_API_ANONYMOUS_ACCESS: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - cme-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== Services ==========
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cme-auth-service
    ports:
      - "50051:50051"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GRPC_PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cme-network

  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: cme-company-service
    ports:
      - "50052:50052"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: company_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      NATS_URL: nats://nats:4222
      GRPC_PORT: "50052"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks:
      - cme-network

  material-service:
    build:
      context: ./material-service
      dockerfile: Dockerfile
    container_name: cme-material-service
    ports:
      - "50053:50053"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: material_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GRPC_PORT: "50053"
      MINIO_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cme-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: cme-order-service
    ports:
      - "50054:50054"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: order_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      NATS_URL: nats://nats:4222
      MATERIAL_SERVICE_ADDR: material-service:50053
      GRPC_PORT: "50054"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      material-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - cme-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: cme-review-service
    ports:
      - "50055:50055"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: review_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GRPC_PORT: "50055"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cme-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: cme-notification-service
    ports:
      - "50056:50056"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: notif_db
      DB_USER: cme
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      NATS_URL: nats://nats:4222
      GRPC_PORT: "50056"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks:
      - cme-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cme-api-gateway
    ports:
      - "8085:8085"
    environment:
      AUTH_SERVICE_ADDR: auth-service:50051
      COMPANY_SERVICE_ADDR: company-service:50052
      MATERIAL_SERVICE_ADDR: material-service:50053
      ORDER_SERVICE_ADDR: order-service:50054
      REVIEW_SERVICE_ADDR: review-service:50055
      NOTIFICATION_SERVICE_ADDR: notification-service:50056
      HTTP_PORT: "8085"
    depends_on:
      - auth-service
      - company-service
      - material-service
      - order-service
      - review-service
      - notification-service
    restart: unless-stopped
    networks:
      - cme-network

volumes:
  pg-data:
  minio-data:

networks:
  cme-network:
    driver: bridge
