<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-white rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-surface-container-highest overflow-hidden">
<!-- Header -->
<div class="p-8 pb-6 text-center">
<div class="flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined filled text-leaf-green text-3xl">recycling</span>
<h1 class="font-headline-md text-headline-md text-leaf-green font-bold">CircuTrade</h1>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">The Industrial Material Exchange</p>
</div>
<!-- Tab Navigation -->
<div class="flex border-b border-surface-container-highest">
<button class="flex-1 py-4 font-title-lg text-title-lg text-leaf-green border-b-2 border-leaf-green bg-surface-container-lowest transition-colors" id="tab-login">
                Đăng nhập
            </button>
<button class="flex-1 py-4 font-title-lg text-title-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" id="tab-register">
                Đăng ký
            </button>
</div>
<!-- Content Area -->
<div class="p-8 pt-6">
<!-- Login Form (Active by default) -->
<form class="space-y-6 block" id="form-login">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="login-email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-ocean-blue focus:ring-1 focus:ring-ocean-blue transition-shadow placeholder-outline" id="login-email" placeholder="Enter your email" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="login-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-ocean-blue focus:ring-1 focus:ring-ocean-blue transition-shadow placeholder-outline" id="login-password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-leaf-green hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-leaf-green text-surface-white font-label-md text-label-md py-3 rounded-lg hover:shadow-md hover:bg-primary transition-all active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
<!-- Registration Form (Hidden by default) -->
<form class="space-y-5 hidden" id="form-register">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="reg-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-ocean-blue focus:ring-1 focus:ring-ocean-blue transition-shadow placeholder-outline" id="reg-name" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="reg-email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-ocean-blue focus:ring-1 focus:ring-ocean-blue transition-shadow placeholder-outline" id="reg-email" placeholder="john@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="reg-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-ocean-blue focus:ring-1 focus:ring-ocean-blue transition-shadow placeholder-outline" id="reg-password" placeholder="Create a password" type="password"/>
</div>
</div>
<div class="space-y-3 pt-2">
<label class="font-label-md text-label-md text-on-surface block">Account Type</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="account_type" type="radio" value="business"/>
<div class="border border-surface-container-highest rounded-lg p-3 text-center peer-checked:border-leaf-green peer-checked:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-outline peer-checked:text-leaf-green mb-1">domain</span>
<div class="font-label-md text-label-md text-on-surface-variant peer-checked:text-leaf-green">Business</div>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="account_type" type="radio" value="individual"/>
<div class="border border-surface-container-highest rounded-lg p-3 text-center peer-checked:border-leaf-green peer-checked:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-outline peer-checked:text-leaf-green mb-1">person</span>
<div class="font-label-md text-label-md text-on-surface-variant peer-checked:text-leaf-green">Individual</div>
</div>
</label>
</div>
</div>
<button class="w-full mt-4 bg-leaf-green text-surface-white font-label-md text-label-md py-3 rounded-lg hover:shadow-md hover:bg-primary transition-all active:scale-[0.98]" type="submit">
                    Create Account
                </button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-white font-label-md text-label-md text-outline">Or continue with</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 border border-surface-container-highest rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-body-sm text-body-sm">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-2.5 border border-surface-container-highest rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-body-sm text-body-sm">
<svg class="w-5 h-5" fill="#0A66C2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
</svg>
                    LinkedIn
                </button>
</div>
<p class="mt-8 text-center font-body-sm text-body-sm text-on-surface-variant">
                By continuing, you agree to our <a class="text-leaf-green hover:underline" href="#">Terms of Service</a> and <a class="text-leaf-green hover:underline" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            const activeTabClasses = ['text-leaf-green', 'border-b-2', 'border-leaf-green', 'bg-surface-container-lowest'];
            const inactiveTabClasses = ['text-on-surface-variant', 'border-b-0', 'hover:bg-surface-container-low'];

            function switchTab(isLogin) {
                if (isLogin) {
                    formLogin.classList.remove('hidden');
                    formLogin.classList.add('block');
                    formRegister.classList.add('hidden');
                    formRegister.classList.remove('block');

                    tabLogin.classList.add(...activeTabClasses);
                    tabLogin.classList.remove(...inactiveTabClasses);
                    
                    tabRegister.classList.remove(...activeTabClasses);
                    tabRegister.classList.add(...inactiveTabClasses);
                } else {
                    formRegister.classList.remove('hidden');
                    formRegister.classList.add('block');
                    formLogin.classList.add('hidden');
                    formLogin.classList.remove('block');

                    tabRegister.classList.add(...activeTabClasses);
                    tabRegister.classList.remove(...inactiveTabClasses);
                    
                    tabLogin.classList.remove(...activeTabClasses);
                    tabLogin.classList.add(...inactiveTabClasses);
                }
            }

            tabLogin.addEventListener('click', () => switchTab(true));
            tabRegister.addEventListener('click', () => switchTab(false));
        });
    </script>
</body></html>
