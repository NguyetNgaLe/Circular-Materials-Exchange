<style>

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center font-sans antialiased p-margin-mobile md:p-margin-desktop">
<div class="max-w-md w-full bg-surface-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.05)] border border-outline-variant p-8 relative overflow-hidden">

</p>
</div>
<!-- Form -->
<form class="space-y-6" id="otp-form">
<div class="flex justify-between gap-2" id="otp-inputs">
<input autofocus="" class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
<input class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
<input class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
<input class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
<input class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
<input class="otp-input font-headline-md text-on-surface" maxlength="1" type="number"/>
</div>
<!-- Timer and Resend -->
<div class="flex items-center justify-between font-body-sm text-body-sm">
<div class="text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">schedule</span>
                    Mã hết hạn sau: <span class="font-semibold text-exchange-orange" id="timer">02:00</span>
</div>
<button class="text-ocean-blue font-semibold hover:underline disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="resend-btn" type="button">
                    Gửi lại mã
                </button>
</div>
<!-- Submit Button -->
<button class="w-full bg-leaf-green text-surface-white font-title-lg text-title-lg py-3 rounded-lg hover:shadow-[0_4px_12px_rgba(112,173,71,0.2)] hover:bg-primary transition-all active:scale-95 flex justify-center items-center gap-2" type="button">
                Xác thực
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Return Link -->
<div class="mt-6 text-center">
<a class="font-body-sm text-body-sm text-ocean-blue hover:underline inline-flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                 Quay lại đăng nhập
             </a>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            // Auto-focus and backspace handling for OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (input.value.length > 1) {
                        input.value = input.value.slice(0, 1);
                    }
                    if (input.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            // Timer logic
            let timeLeft = 120; // 2 minutes in seconds
            let timerId;

            function updateTimer() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft === 0) {
                    clearInterval(timerId);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.classList.remove('text-exchange-orange');
                    timerDisplay.classList.add('text-error');
                    resendBtn.disabled = false;
                } else {
                    timeLeft--;
                }
            }

            function startTimer() {
                timeLeft = 120;
                resendBtn.disabled = true;
                timerDisplay.classList.add('text-exchange-orange');
                timerDisplay.classList.remove('text-error');
                updateTimer();
                timerId = setInterval(updateTimer, 1000);
            }

            resendBtn.addEventListener('click', () => {
                if(!resendBtn.disabled) {
                    // Simulate resending OTP
                    inputs.forEach(input => input.value = '');
                    inputs[0].focus();
                    startTimer();
                }
            });

            startTimer();
        });
    </script>
